name: Daily AI Digest

# v1 是 08:00 和 20:00 两个 cron 跑同一个 docs/index.html，
# 后一次直接覆盖前一次，等于每天白跑一趟。
# v2 一天一次，并且每次都往 docs/archive/{date}.html 存一份归档。
on:
  schedule:
    # cron 是 UTC。北京时间 08:30 = UTC 00:30
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ① 宽召回：每源 12 篇、72 小时窗口，顺带把社区热度信号一起带回来
      - name: 召回
        run: python src/fetch_sources.py

      # ② 事件聚类：把讲同一件事的条目合并，跨源覆盖数是后面打分最强的信号
      - name: 聚类
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/cluster.py

      # ③ 打分排序：纯 Python，可解释、可复现，分数和依据都会印在页面上
      - name: 排序
        run: python src/rank.py

      # ④-a 只给进深读区的十几条抓正文
      - name: 抓正文
        run: python src/readfull.py

      # ④-b 分级摘要：深读单条调用 + 全文，速览只翻译标题
      - name: 摘要
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/summarize.py

      # ⑤ 渲染 + 归档
      - name: 渲染
        run: python src/render.py

      # ⑤-b RSS：只推深读区，速览的一百多条不进阅读器
      - name: 输出 RSS
        run: python src/feed.py

      # ⑥ 按最终发布结果写 14 天记忆（必须在降级筛选之后）
      - name: 提交记忆
        run: python src/commit_memory.py

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ 也要提交：memory.json 是跨天去重和「线索追踪」的唯一状态，
          # 不提交的话每天都是第一天。health.json 用于页面上的零产出源警告。
          git add docs data
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
