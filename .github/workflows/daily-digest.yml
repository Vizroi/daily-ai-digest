name: Game Design Daily

# 日报与市场采样共用串行发布队列，避免相互覆盖。
on:
  push:
    branches: [main]
  schedule:
    # cron 是 UTC。北京时间 08:30 = UTC 00:30
    - cron: "30 0 * * *"
    # 市场快照：北京时间 01:15 / 07:15 / 13:15 / 19:15。
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 更新内容
        type: choice
        default: daily
        options: [daily, market, publish]

permissions: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  publish_existing:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 检查栏目与内容规则
        run: python -m unittest discover -s tests -v

      - name: 上传已审核的站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '30 0 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 检查栏目与内容规则
        run: python -m unittest discover -s tests -v

      # ① 多平台候选：新闻72小时、设计30天，未授权来源清楚标记并跳过。
      - name: 召回
        env:
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNELS_JSON: ${{ secrets.DISCORD_CHANNELS_JSON }}
        run: python src/fetch_sources.py

      # ② 合并同一事件的中英文报道
      - name: 聚类
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/cluster.py

      # ③ 游戏日报、策划精选、AI 快讯与精选各自筛选
      - name: 排序
        run: python src/rank.py

      # ④-a 读取本期候选正文，摘要与正文分别标记
      - name: 抓正文
        run: python src/readfull.py

      # ④-b 中英文标题、日报短摘要与策划精读
      - name: 摘要
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python src/summarize.py

      - name: 更新 Steam 市场快照
        run: python src/steam_market.py

      - name: 渲染 Steam 市场观察页
        run: python src/market_render.py

      # ⑤ 渲染 + 归档；新刊保存当次市场摘要，旧刊不回填。
      - name: 渲染
        run: python src/render.py

      - name: 渲染 AI 快讯与精选并归档
        run: python src/ai_render.py

      - name: 来源目录与本轮状态
        run: python src/source_directory.py data/source_report.json docs/sources.html

      # ⑤-b RSS：汇总游戏与 AI 两页的本期内容
      - name: 输出 RSS
        run: python src/feed.py

      # ⑥ 按最终发布结果写30天记忆（必须在降级筛选之后）
      - name: 提交记忆
        run: python src/commit_memory.py

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 保留发布记忆和采集状态，供下次筛选及来源目录使用。
          git add docs data
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: 上传本期站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  market_sample:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '15 5,11,17,23 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'market'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 检查数据和页面规则
        run: python -m unittest discover -s tests -v

      - name: 采集市场快照与历史
        run: python src/steam_market.py

      - name: 更新市场页与首页市场摘要
        run: |
          python src/market_render.py
          python src/render.py --no-archive

      - name: 提交市场记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market_history.json docs/market.html docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "market: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: 上传站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: [publish_existing, build, market_sample]
    # 三条准备路径互斥；只部署成功上传的产物。
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.publish_existing.result == 'success' || needs.build.result == 'success' || needs.market_sample.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
